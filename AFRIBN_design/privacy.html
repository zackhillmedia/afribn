  AFRIBN.marketing(null);
  document.getElementById('tp').innerHTML = AFRIBN.ic('shield','width="13" height="13"') + ' Legal';
  AFRIBN.legalDoc([
    ['Overview','AFRIBN ("we", "us") provides strategic intelligence products. This policy explains what data we collect, how we use it, and the rights you have. It applies to our website, platform and APIs.'],
    ['Information we collect','We collect account information you provide (name, work email, organization, role), usage data generated as you use the platform, and billing details processed by our payment providers. We do not sell personal data.'],
    ['How we use information','To provision and operate your workspace, tailor coverage to your stated needs, secure the platform, process payments, provide support, and improve our intelligence products. Workspace provisioning is reviewed by our team to match the access you request.'],
    ['Legal bases','We process data under contract (to deliver the service), legitimate interest (security, product improvement), consent (marketing communications you can withdraw), and legal obligation where applicable.'],
    ['Sharing & sub-processors','We share data only with vetted sub-processors (hosting, payments, email/SMS delivery, analytics) under data-protection agreements, and where required by law. A current sub-processor list is available on request.'],
    ['Data retention','We retain account and intelligence-workspace data for the life of your subscription and a limited period afterwards for legal and audit purposes, then delete or anonymize it.'],
    ['International transfers','Where data crosses borders, we rely on appropriate safeguards such as standard contractual clauses. Enterprise customers can request regional or on-prem deployment.'],
    ['Your rights','Subject to your jurisdiction, you may access, correct, export or delete your personal data, and object to or restrict certain processing. Contact privacy@afribn.com to exercise these rights.'],
    ['Security','We protect data with encryption in transit and at rest, role-based access control, audit logging and least-privilege practices. See our Security page for detail.'],
    ['Changes & contact','We will post material changes here and, where appropriate, notify you. Questions? Email privacy@afribn.com.'],
  ]);
