<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFRIBN — Create your profile</title>
<link rel="stylesheet" href="assets/afribn.css">
<link rel="stylesheet" href="assets/marketing.css">
<style>
  .signup-split { display:grid; grid-template-columns:1fr 1fr; min-height:calc(100vh - 76px); }
  .signup-aside { position:relative; overflow:hidden; padding:54px; display:flex; flex-direction:column;
    background: radial-gradient(90% 70% at 80% 10%, rgba(232,37,45,0.32), transparent 55%), linear-gradient(180deg,#0c0809,#15090a 60%,#1c0c0d); }
  .signup-aside .tagline { margin-top:auto; max-width:420px; }
  .signup-aside h2 { font-size:32px; font-weight:800; letter-spacing:-0.03em; line-height:1.08; }
  .signup-aside h2 .r { color:var(--red); }
  .signup-aside p { color:var(--ink-2); font-size:15px; margin-top:14px; line-height:1.55; }
  .signup-aside .chk { list-style:none; padding:0; margin:24px 0 0; display:flex; flex-direction:column; gap:13px; }
  .signup-aside .chk li { display:flex; align-items:center; gap:11px; font-size:14.5px; color:var(--ink); }
  .signup-aside .chk li svg { width:19px; height:19px; color:var(--green); flex:none; }
  .signup-form { display:flex; align-items:center; justify-content:center; padding:40px; }
  .pw-meter { height:5px; border-radius:5px; background:var(--panel-3); overflow:hidden; margin-top:8px; }
  .pw-meter span { display:block; height:100%; width:0; border-radius:5px; transition:.25s; }
  @media (max-width:880px){ .signup-split{grid-template-columns:1fr} .signup-aside{display:none} }
</style>
</head>
<body class="mkt">
<header id="mhead"></header>

<div class="signup-split">
  <aside class="signup-aside">
    <div id="topLogo"></div>
    <div class="tagline">
      <h2>Create your<br>AFRIBN <span class="r">profile</span>.</h2>
      <p>Set up your account, then we'll provision the workspace matched to your request.</p>
      <ul class="chk" id="asideChk"></ul>
    </div>
  </aside>

  <div class="signup-form">
    <div class="auth-card" style="max-width:420px">
      <div style="margin-bottom:24px" id="formLogo"></div>
      <h1 style="font-size:27px;font-weight:800;letter-spacing:-0.02em">Create your profile</h1>
      <p class="muted" style="margin:8px 0 24px;font-size:14.5px">Step 2 of provisioning — set your credentials.</p>
      <form id="suForm">
        <div class="field-row"><div class="field"><label>First name</label><input id="fn" placeholder="Jane"></div><div class="field"><label>Last name</label><input id="ln" placeholder="Okafor"></div></div>
        <div class="field"><label>Work email</label><input id="em" type="email" placeholder="jane@organization.org"></div>
        <div class="field"><label>Organization</label><input id="org" placeholder="Ministry of Finance"></div>
        <div class="field"><label>Password</label><input id="pw" type="password" placeholder="Create a strong password"><div class="pw-meter"><span id="pwBar"></span></div><div class="muted" id="pwHint" style="font-size:12px;margin-top:6px">Use 8+ characters with a mix of letters, numbers & symbols.</div></div>
        <label class="row gap-8" style="align-items:flex-start;font-size:13px;color:var(--ink-2);margin:4px 0 18px;cursor:pointer"><input type="checkbox" id="agree" style="width:auto;accent-color:var(--red);margin-top:2px"> <span>I agree to AFRIBN's <a href="terms.html" style="color:var(--red-bright)">Terms</a> and <a href="privacy.html" style="color:var(--red-bright)">Privacy Policy</a>.</span></label>
        <button type="submit" class="btn btn-primary" style="width:100%;height:50px">Create profile <span id="ci"></span></button>
      </form>
      <p class="center muted" style="font-size:13.5px;margin-top:20px">Already have an account? <a class="muted-link" href="login.html" style="font-weight:600">Log in</a></p>
    </div>
  </div>
</div>

<footer id="mfoot" class="mfoot"></footer>

<script src="assets/afribn.js"></script>
<script src="assets/marketing.js"></script>
<script>
  const $ = s => document.querySelector(s);
  AFRIBN.marketing(null);
  const ic = AFRIBN.ic;
  $('#topLogo').innerHTML = AFRIBN.logo({h:34}); $('#formLogo').innerHTML = AFRIBN.logo({h:30}); $('#ci').innerHTML = ic('arrowRight','width="17" height="17"');
  $('#asideChk').innerHTML = ['Decision-grade intelligence across 54 countries','Source reliability & verification on every item','Workspace tailored to your countries & sectors'].map(t=>`<li>${ic('checkCircle')} ${t}</li>`).join('');

  $('#pw').addEventListener('input', e=>{
    const v=e.target.value; let s=0; if(v.length>=8)s++; if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++; if(/\d/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
    const bar=$('#pwBar'), pct=[0,30,55,80,100][s], col=['#3a3a40','#E5252A','#FF6B35','#E3B341','#3FB950'][s];
    bar.style.width=pct+'%'; bar.style.background=col;
    $('#pwHint').textContent=['Use 8+ characters with a mix of letters, numbers & symbols.','Weak password','Fair — add more variety','Good password','Strong password'][s];
  });

  $('#suForm').addEventListener('submit', e=>{ e.preventDefault();
    if(!$('#fn').value||!$('#em').value||!$('#pw').value){ AFRIBN.toast('Please complete the form','warn'); return; }
    if(!$('#agree').checked){ AFRIBN.toast('Please accept the Terms & Privacy Policy','warn'); return; }
    AFRIBN.toast('Profile created — taking you to checkout','ok'); localStorage.setItem('afribn_role','client');
    setTimeout(()=>location.href='checkout.html', 800);
  });
</script>
</body>
</html>
