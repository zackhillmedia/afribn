<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFRIBN — Contact</title>
<!-- afribn:seo -->
<meta name="description" content="AFRIBN delivers real-time strategic intelligence on Africa's top markets — political, security, economic and policy signals for investors, institutions and decision-makers.">
<link rel="canonical" href="https://www.afribn.com/design/contact.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AFRIBN">
<meta property="og:title" content="AFRIBN — Contact">
<meta property="og:description" content="AFRIBN delivers real-time strategic intelligence on Africa's top markets — political, security, economic and policy signals for investors, institutions and decision-makers.">
<meta property="og:url" content="https://www.afribn.com/design/contact.html">
<meta property="og:image" content="https://www.afribn.com/design/assets/favicon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AFRIBN — Contact">
<meta name="twitter:description" content="AFRIBN delivers real-time strategic intelligence on Africa's top markets — political, security, economic and policy signals for investors, institutions and decision-makers.">
<meta name="theme-color" content="#0a0809">
<link rel="stylesheet" href="assets/afribn.css">
<link rel="stylesheet" href="assets/marketing.css">
</head>
<body class="mkt">
<header id="mhead"></header>

<section class="sec" style="padding-top:60px">
  <div class="wrap-m">
    <div class="split" style="align-items:start">
      <div>
        <span class="eyebrow-pill"><span class="lv"></span> Contact</span>
        <h1 style="font-size:clamp(34px,4.5vw,50px);font-weight:800;letter-spacing:-0.03em;line-height:1.04;margin:20px 0 0">Let's talk about<br>your <span style="color:var(--red)">mandate</span>.</h1>
        <p class="muted" style="font-size:17px;margin:16px 0 0;max-width:440px;line-height:1.55">Tell us what you need to monitor and we'll get you to the right team — sales, support or partnerships.</p>
        <div class="stack gap-16" id="channels" style="margin-top:34px"></div>
      </div>
      <div class="form-card">
        <div class="step-h" style="font-size:18px;margin-bottom:18px">Send us a message</div>
        <form id="cForm">
          <div class="field-row"><div class="field"><label>Name</label><input id="cn" placeholder="Your name"></div><div class="field"><label>Work email</label><input id="ce" type="email" placeholder="you@org.org"></div></div>
          <div class="field"><label>Organization</label><input placeholder="Organization"></div>
          <div class="field"><label>Topic</label><select><option>Sales & access</option><option>Government / institutional</option><option>Partnerships</option><option>Press & media</option><option>Support</option></select></div>
          <div class="field"><label>Message</label><textarea placeholder="How can we help?"></textarea></div>
          <button type="submit" class="btn btn-primary" style="width:100%;height:50px">Send message <span id="si"></span></button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer id="mfoot" class="mfoot"></footer>

<script src="assets/afribn.js"></script>
<script src="assets/marketing.js"></script>
<script>
  const $ = s => document.querySelector(s); const ic = AFRIBN.ic;
  AFRIBN.marketing(null);
  $('#si').innerHTML = ic('send','width="16" height="16"');
  const CH=[['deal','Sales & access','Tailored workspaces & pricing','sales@afribn.com'],['bank','Government & institutions','Procurement-ready engagements','gov@afribn.com'],['message','Support','For existing customers','help.html'],['file','Press & media','Media enquiries','press.html']];
  $('#channels').innerHTML=CH.map(([i,t,d,v])=>`<div class="row gap-12" style="align-items:flex-start"><span class="mi" style="margin:0;width:44px;height:44px;flex:none">${ic(i)}</span><div><div style="font-weight:700">${t}</div><div class="muted" style="font-size:13px">${d}</div><div style="color:var(--red-bright);font-size:13.5px;font-weight:600;margin-top:2px">${v}</div></div></div>`).join('');
  $('#cForm').addEventListener('submit',e=>{ e.preventDefault(); if(!$('#cn').value||!/.+@.+\..+/.test($('#ce').value)){AFRIBN.toast('Please complete name & valid email','warn');return;} AFRIBN.toast('Message sent — we\\'ll reply within 1 business day','ok'); e.target.reset(); });
</script>
</body>
</html>
