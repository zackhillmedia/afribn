services:
  afribn-api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - afribn-data:/app/data
      - afribn-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afribn
      POSTGRES_USER: afribn
      POSTGRES_PASSWORD: afribn
    volumes:
      - afribn-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  afribn-data:
  afribn-uploads:
  afribn-postgres:
